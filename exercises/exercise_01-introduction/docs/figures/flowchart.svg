<svg xmlns="http://www.w3.org/2000/svg" width="920" height="610" viewBox="0 0 920 610">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#31445f"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f9fc"/>
<text x="460" y="48" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold" fill="#14213d">Exercise 1 — execution flow</text>
<text x="460" y="82" text-anchor="middle" font-family="Arial" font-size="14" fill="#49566a">Exercise-specific control flow</text>
<rect x="70" y="120" width="780" height="58" rx="12" fill="#dceeff" stroke="#59718f" stroke-width="1.5"/>
<text x="460" y="156" text-anchor="middle" font-family="Arial" font-size="16" fill="#152238">Validate positive ticket counts and a non-empty task set</text>
<path d="M460 178 L460 191" stroke="#31445f" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="193" width="780" height="58" rx="12" fill="#e5f3ed" stroke="#59718f" stroke-width="1.5"/>
<text x="460" y="229" text-anchor="middle" font-family="Arial" font-size="16" fill="#152238">Build the ready set and compute total tickets T</text>
<path d="M460 251 L460 264" stroke="#31445f" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="266" width="780" height="58" rx="12" fill="#fff0d8" stroke="#59718f" stroke-width="1.5"/>
<text x="460" y="302" text-anchor="middle" font-family="Arial" font-size="16" fill="#152238">Draw an unbiased integer r in [1, T]</text>
<path d="M460 324 L460 337" stroke="#31445f" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="339" width="780" height="58" rx="12" fill="#f0e8ff" stroke="#59718f" stroke-width="1.5"/>
<text x="460" y="375" text-anchor="middle" font-family="Arial" font-size="16" fill="#152238">Walk cumulative intervals until r is covered</text>
<path d="M460 397 L460 410" stroke="#31445f" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="412" width="780" height="58" rx="12" fill="#e7edf4" stroke="#59718f" stroke-width="1.5"/>
<text x="460" y="448" text-anchor="middle" font-family="Arial" font-size="16" fill="#152238">Run winner, update remaining burst and repeat</text>
</svg>