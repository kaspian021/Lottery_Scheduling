<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900"><rect width="100%" height="100%" fill="#f2f6fa"/><rect x="20" y="15" width="1460" height="75" rx="12" fill="#173b65"/><text x="750" y="48" fill="white" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle">LOTTERY SCHEDULING — EXERCISE 5</text><text x="750" y="73" fill="#e5edf8" font-family="Arial" font-size="16" text-anchor="middle">Semaphore • Monitor • Monitor + Semaphore</text><rect x="20" y="110" width="470" height="765" rx="12" fill="white" stroke="#2878b5" stroke-width="2"/><rect x="20" y="110" width="470" height="55" rx="12" fill="#d9efff"/><text x="35" y="145" font-family="Arial" font-size="19" font-weight="bold" fill="#2878b5">1. Lottery with Semaphore</text><text x="40" y="200" font-family="Arial" font-size="14" fill="#263d51">Binary semaphore guards shared scheduler state.</text><text x="40" y="245" font-family="Arial" font-size="15" font-weight="bold" fill="#2878b5">FLOWCHART</text><rect x="65" y="265" width="380" height="42" rx="7" fill="#d9efff" stroke="#2878b5"/><text x="255" y="290" font-family="Arial" font-size="12" text-anchor="middle" fill="#17324d">Initialize processes and ticket counts</text><path d="M255 307 v12" stroke="#39546e" stroke-width="1.5"/><rect x="65" y="320" width="380" height="42" rx="7" fill="#d9efff" stroke="#2878b5"/><text x="255" y="345" font-family="Arial" font-size="12" text-anchor="middle" fill="#17324d">Find ready processes</text><path d="M255 362 v12" stroke="#39546e" stroke-width="1.5"/><rect x="65" y="375" width="380" height="42" rx="7" fill="#d9efff" stroke="#2878b5"/><text x="255" y="400" font-family="Arial" font-size="12" text-anchor="middle" fill="#17324d">Sum ready tickets</text><path d="M255 417 v12" stroke="#39546e" stroke-width="1.5"/><rect x="65" y="430" width="380" height="42" rx="7" fill="#d9efff" stroke="#2878b5"/><text x="255" y="455" font-family="Arial" font-size="12" text-anchor="middle" fill="#17324d">Draw winning ticket</text><path d="M255 472 v12" stroke="#39546e" stroke-width="1.5"/><rect x="65" y="485" width="380" height="42" rx="7" fill="#d9efff" stroke="#2878b5"/><text x="255" y="510" font-family="Arial" font-size="12" text-anchor="middle" fill="#17324d">Run selected process for one quantum</text><path d="M255 527 v12" stroke="#39546e" stroke-width="1.5"/><rect x="65" y="540" width="380" height="42" rx="7" fill="#d9efff" stroke="#2878b5"/><text x="255" y="565" font-family="Arial" font-size="12" text-anchor="middle" fill="#17324d">Update state and release / notify</text><text x="40" y="625" font-family="Arial" font-size="15" font-weight="bold" fill="#2878b5">PSEUDOCODE</text><rect x="35" y="640" width="440" height="130" rx="8" fill="#f9fbfd" stroke="#d9efff"/><text x="48" y="665" font-family="monospace" font-size="11" fill="#263d51">while processes remain:</text><text x="48" y="686" font-family="monospace" font-size="11" fill="#263d51">  lock shared state</text><text x="48" y="707" font-family="monospace" font-size="11" fill="#263d51">  draw ticket among ready processes</text><text x="48" y="728" font-family="monospace" font-size="11" fill="#263d51">  run winner for one quantum</text><text x="48" y="749" font-family="monospace" font-size="11" fill="#263d51">  update trace; unlock / notify</text><text x="40" y="810" font-family="Arial" font-size="12" fill="#263d51">Gantt chart: generated from the seeded run.</text><rect x="515" y="110" width="470" height="765" rx="12" fill="white" stroke="#22845b" stroke-width="2"/><rect x="515" y="110" width="470" height="55" rx="12" fill="#dff6e8"/><text x="530" y="145" font-family="Arial" font-size="19" font-weight="bold" fill="#22845b">2. Lottery with Monitor</text><text x="535" y="200" font-family="Arial" font-size="14" fill="#263d51">Condition lock protects state and notifies waiters.</text><text x="535" y="245" font-family="Arial" font-size="15" font-weight="bold" fill="#22845b">FLOWCHART</text><rect x="560" y="265" width="380" height="42" rx="7" fill="#dff6e8" stroke="#22845b"/><text x="750" y="290" font-family="Arial" font-size="12" text-anchor="middle" fill="#17324d">Initialize processes and ticket counts</text><path d="M750 307 v12" stroke="#39546e" stroke-width="1.5"/><rect x="560" y="320" width="380" height="42" rx="7" fill="#dff6e8" stroke="#22845b"/><text x="750" y="345" font-family="Arial" font-size="12" text-anchor="middle" fill="#17324d">Find ready processes</text><path d="M750 362 v12" stroke="#39546e" stroke-width="1.5"/><rect x="560" y="375" width="380" height="42" rx="7" fill="#dff6e8" stroke="#22845b"/><text x="750" y="400" font-family="Arial" font-size="12" text-anchor="middle" fill="#17324d">Sum ready tickets</text><path d="M750 417 v12" stroke="#39546e" stroke-width="1.5"/><rect x="560" y="430" width="380" height="42" rx="7" fill="#dff6e8" stroke="#22845b"/><text x="750" y="455" font-family="Arial" font-size="12" text-anchor="middle" fill="#17324d">Draw winning ticket</text><path d="M750 472 v12" stroke="#39546e" stroke-width="1.5"/><rect x="560" y="485" width="380" height="42" rx="7" fill="#dff6e8" stroke="#22845b"/><text x="750" y="510" font-family="Arial" font-size="12" text-anchor="middle" fill="#17324d">Run selected process for one quantum</text><path d="M750 527 v12" stroke="#39546e" stroke-width="1.5"/><rect x="560" y="540" width="380" height="42" rx="7" fill="#dff6e8" stroke="#22845b"/><text x="750" y="565" font-family="Arial" font-size="12" text-anchor="middle" fill="#17324d">Update state and release / notify</text><text x="535" y="625" font-family="Arial" font-size="15" font-weight="bold" fill="#22845b">PSEUDOCODE</text><rect x="530" y="640" width="440" height="130" rx="8" fill="#f9fbfd" stroke="#dff6e8"/><text x="543" y="665" font-family="monospace" font-size="11" fill="#263d51">while processes remain:</text><text x="543" y="686" font-family="monospace" font-size="11" fill="#263d51">  lock shared state</text><text x="543" y="707" font-family="monospace" font-size="11" fill="#263d51">  draw ticket among ready processes</text><text x="543" y="728" font-family="monospace" font-size="11" fill="#263d51">  run winner for one quantum</text><text x="543" y="749" font-family="monospace" font-size="11" fill="#263d51">  update trace; unlock / notify</text><text x="535" y="810" font-family="Arial" font-size="12" fill="#263d51">Gantt chart: generated from the seeded run.</text><rect x="1010" y="110" width="470" height="765" rx="12" fill="white" stroke="#7650b8" stroke-width="2"/><rect x="1010" y="110" width="470" height="55" rx="12" fill="#ebe2ff"/><text x="1025" y="145" font-family="Arial" font-size="19" font-weight="bold" fill="#7650b8">3. Lottery with Both</text><text x="1030" y="200" font-family="Arial" font-size="14" fill="#263d51">Acquire semaphore first, then monitor lock.</text><text x="1030" y="245" font-family="Arial" font-size="15" font-weight="bold" fill="#7650b8">FLOWCHART</text><rect x="1055" y="265" width="380" height="42" rx="7" fill="#ebe2ff" stroke="#7650b8"/><text x="1245" y="290" font-family="Arial" font-size="12" text-anchor="middle" fill="#17324d">Initialize processes and ticket counts</text><path d="M1245 307 v12" stroke="#39546e" stroke-width="1.5"/><rect x="1055" y="320" width="380" height="42" rx="7" fill="#ebe2ff" stroke="#7650b8"/><text x="1245" y="345" font-family="Arial" font-size="12" text-anchor="middle" fill="#17324d">Find ready processes</text><path d="M1245 362 v12" stroke="#39546e" stroke-width="1.5"/><rect x="1055" y="375" width="380" height="42" rx="7" fill="#ebe2ff" stroke="#7650b8"/><text x="1245" y="400" font-family="Arial" font-size="12" text-anchor="middle" fill="#17324d">Sum ready tickets</text><path d="M1245 417 v12" stroke="#39546e" stroke-width="1.5"/><rect x="1055" y="430" width="380" height="42" rx="7" fill="#ebe2ff" stroke="#7650b8"/><text x="1245" y="455" font-family="Arial" font-size="12" text-anchor="middle" fill="#17324d">Draw winning ticket</text><path d="M1245 472 v12" stroke="#39546e" stroke-width="1.5"/><rect x="1055" y="485" width="380" height="42" rx="7" fill="#ebe2ff" stroke="#7650b8"/><text x="1245" y="510" font-family="Arial" font-size="12" text-anchor="middle" fill="#17324d">Run selected process for one quantum</text><path d="M1245 527 v12" stroke="#39546e" stroke-width="1.5"/><rect x="1055" y="540" width="380" height="42" rx="7" fill="#ebe2ff" stroke="#7650b8"/><text x="1245" y="565" font-family="Arial" font-size="12" text-anchor="middle" fill="#17324d">Update state and release / notify</text><text x="1030" y="625" font-family="Arial" font-size="15" font-weight="bold" fill="#7650b8">PSEUDOCODE</text><rect x="1025" y="640" width="440" height="130" rx="8" fill="#f9fbfd" stroke="#ebe2ff"/><text x="1038" y="665" font-family="monospace" font-size="11" fill="#263d51">while processes remain:</text><text x="1038" y="686" font-family="monospace" font-size="11" fill="#263d51">  lock shared state</text><text x="1038" y="707" font-family="monospace" font-size="11" fill="#263d51">  draw ticket among ready processes</text><text x="1038" y="728" font-family="monospace" font-size="11" fill="#263d51">  run winner for one quantum</text><text x="1038" y="749" font-family="monospace" font-size="11" fill="#263d51">  update trace; unlock / notify</text><text x="1030" y="810" font-family="Arial" font-size="12" fill="#263d51">Gantt chart: generated from the seeded run.</text></svg>