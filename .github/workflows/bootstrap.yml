name: Bootstrap Lottery course project
on:
  push:
    branches:
      - Lottery-Scheduling-All-Exercises
    paths:
      - '.staging/ready.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hydrate-verify-and-push:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Add all Lottery Scheduling course exercises and evidence' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: Lottery-Scheduling-All-Exercises
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct and verify project source archive
        run: |
          cat .staging/source-*.b64 | base64 -d > .staging/lottery-course-source.tar.xz
          echo "0db99423d1e0aae333808aa689d4da346150e83a946a335b6570bfe95b5fcdf9  .staging/lottery-course-source.tar.xz" | sha256sum -c -
          tar -xJf .staging/lottery-course-source.tar.xz -C .
          rm -rf .staging
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Regenerate reproducible experiment outputs
        run: python tools/run_all_exercises.py
      - name: Regenerate SVG and PNG figures plus trace animation
        run: python tools/generate_figures.py
      - name: Build the seminar deck
        run: python tools/build_seminar.py
      - name: Validate Markdown links and local image references
        run: python tools/check_docs.py
      - name: Run all tests
        run: |
          mkdir -p outputs
          set -o pipefail
          python -m pytest -q | tee outputs/test_results.txt
      - name: Commit complete project and push the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Add all Lottery Scheduling course exercises and evidence"
            git push origin "HEAD:Lottery-Scheduling-All-Exercises"
          fi
